; PlatformIO (extensão do VS Code). A IDE do Arduino ignora este arquivo.
; Abra a pasta Arduino/ no VS Code com a extensão PlatformIO instalada.
;
; Para gravar, FECHE o simulador do ESP32 antes: os dois não podem usar a
; mesma porta USB ao mesmo tempo.

[platformio]
src_dir = .
default_envs = uno

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
; compila só o .ino e a pasta src/ (igual à IDE do Arduino)
build_src_filter = +<Arduino.ino> +<src/>
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    arduino-libraries/Servo@^1.2.1
